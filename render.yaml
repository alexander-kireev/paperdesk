services:
  - type: web
    name: paperdesk
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 app.app:app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
